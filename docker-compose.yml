# Transfer Edge
#
#   docker compose up --build              the app          -> http://localhost:8501
#   docker compose run --rm train          retrain the model (writes models/, data/)
#   docker compose run --rm tune           re-run the Optuna search (~10 min)
#   docker compose --profile notebooks up jupyter
#                                          notebooks        -> URL with token in the logs
#
# data/ and models/ are bind-mounted: the container reads and writes the same
# files as the local environment. Rebuild (--build) after changing code.

x-project: &project
  build: .
  image: transfer-edge
  volumes:
    - ./data:/app/data
    - ./models:/app/models

services:
  app:
    <<: *project
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  train:
    <<: *project
    command: ["python", "-m", "src.models.train"]
    profiles: ["jobs"]

  tune:
    <<: *project
    command: ["python", "-m", "src.models.tune"]
    profiles: ["jobs"]

  jupyter:
    <<: *project
    # the whole project, so notebooks and their outputs save back to disk
    volumes:
      - ./:/app
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser",
              "--ServerApp.root_dir=/app/notebooks"]
    ports:
      - "127.0.0.1:8888:8888"     # localhost only: a notebook server runs code
    profiles: ["notebooks"]
